name: Bug report
description: Something in the starter does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security issues go to a private advisory instead — see SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auth and sessions
        - Organizations and roles
        - Admin panel
        - Dashboard and lists
        - Uploads (storage)
        - Email
        - i18n and right-to-left
        - UI components
        - Product API (oRPC)
        - Database and migrations
        - Tooling, tests or CI
        - Docs and agent guides
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps from a fresh clone, or a link to a repository that shows it.
      placeholder: |
        1. pnpm install
        2. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: Server log, browser console, or CI output. Remove secrets.
      render: shell
  - type: input
    id: commit
    attributes:
      label: Starter commit
      description: "`git rev-parse --short HEAD` in your copy."
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node 24, pnpm 12, macOS 15, Postgres 18, Vercel

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders: the build never connects to them.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      DIMAH_S3_SECRET: ci-only-secret-at-least-32-characters-long
      S3_REGION: auto
      S3_ENDPOINT: https://s3.example.com
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci
      S3_BUCKET: ci
      S3_PUBLIC_BASE_URL: https://cdn.example.com
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

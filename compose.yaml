# Local PostgreSQL for development: `docker compose up -d --wait`.
# Matches the DATABASE_URL in .env.example. Production uses its own database.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dimah_starter
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dimah_starter"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres:
